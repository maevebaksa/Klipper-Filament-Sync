# RatOS 2.1.x filament entry-point integration
# RATOS_FILAMENT_SYNC_OVERRIDE_V1
#
# These are deliberately narrow overrides of RatOS's public LOAD_FILAMENT and
# UNLOAD_FILAMENT entry points.  All motion, sensor, LED, pause/resume, tip
# forming and IDEX behavior remains in RatOS's original private macros.

[gcode_macro LOAD_FILAMENT]
description: Loads filament using the saved filament profile temperature when TEMP is omitted.
variable_ignore_min_extrude_temp: True
gcode:
	_LEARN_MORE_FILAMENT

	{% set toolhead = params.TOOLHEAD|default(-1)|int %}
	{% if printer["dual_carriage"] is defined and printer.pause_resume.is_paused %}
		{% set current_idex_mode = printer["dual_carriage"].carriage_1|lower %}
		{% if current_idex_mode == 'copy' or current_idex_mode == 'mirror' %}
			{action_raise_error("Loading filament in Copy or Mirror mode is not supported! Select single mode to proceed.")}
		{% else %}
			{% set paused_idex_mode = printer["gcode_macro PAUSE"].idex_mode|lower %}
			{% if paused_idex_mode != 'copy' and paused_idex_mode != 'mirror' %}
				{% set toolhead = printer["gcode_macro PAUSE"].idex_toolhead|int %}
			{% endif %}
		{% endif %}
	{% endif %}

	{% set profile_toolhead = 0 if printer["dual_carriage"] is not defined else toolhead %}
	{% set saved = printer.save_variables.variables %}
	{% set types = saved.filament_types|default([]) %}
	{% set nozzle_temps = saved.filament_nozzle_temps|default([]) %}
	{% set temp_materials = saved.filament_temp_materials|default([]) %}
	{% set saved_material = types[profile_toolhead]|default('')|string if profile_toolhead >= 0 else '' %}
	{% set saved_temp = nozzle_temps[profile_toolhead]|default(0)|int if profile_toolhead >= 0 else 0 %}
	{% set temp_material = temp_materials[profile_toolhead]|default('')|string if profile_toolhead >= 0 else '' %}
	{% set tool_macro = "gcode_macro T%s" % profile_toolhead %}
	{% set ratos_temp = printer[tool_macro].filament_temp|default(0)|int if profile_toolhead >= 0 and printer[tool_macro] is defined else 0 %}
	{% if params.TEMP is defined %}
		{% set temp = params.TEMP|int %}
	{% elif saved_temp > 0 and (saved_material|upper) == (temp_material|upper) and (saved_material|upper) not in ['', 'EMPTY', 'NONE', 'UNKNOWN', 'UNSET'] %}
		{% set temp = saved_temp %}
	{% elif ratos_temp > 0 %}
		{% set temp = ratos_temp %}
	{% else %}
		{% set temp = 220 %}
	{% endif %}

	{% set filament_name = params._NAME|default(saved_material)|string %}
	{% set filament_type = params._TYPE|default(saved_material)|string %}
	{% if filament_name == '' or filament_type == '' %}
		{% set filament_name = 'unknown' %}
		{% set filament_type = 'unknown' %}
	{% endif %}
	{% set automated = params.AUTOMATED|default('false')|lower == 'true' %}

	{% if printer["dual_carriage"] is not defined %}
		_DEFAULT_LOAD_FILAMENT TEMP={temp} NAME='{filament_name}' TYPE='{filament_type}' AUTOMATED={automated}
	{% elif toolhead == 0 or toolhead == 1 %}
		_IDEX_LOAD_FILAMENT TEMP={temp} TOOLHEAD={toolhead} NAME='{filament_name}' TYPE='{filament_type}' AUTOMATED={automated}
	{% else %}
		RATOS_ECHO MSG="Please select toolhead! 0 = left, 1 = right toolhead"
	{% endif %}


