# OrcaSlicer / KlipperScreen filament metadata helpers
#
# The bridge detects physical KTC tools (or Tn macros as a fallback), saves the
# result as filament_tool_count, and mirrors these canonical save_variables
# arrays to Moonraker's lane_data namespace.

# The installer selects this file for RatOS or standard Klipper without
# changing the common filament metadata macros below.
[include platform-integration.cfg]

[gcode_macro SET_TOOL_FILAMENT]
description: Set physical-tool filament metadata; MATERIAL=PLA COLOR=RRGGBB NOZZLE_TEMP=220 BED_TEMP=60, or EMPTY=1
gcode:
  {% if params.TOOL is not defined %}
    { action_raise_error('SET_TOOL_FILAMENT requires TOOL=<physical tool number>') }
  {% endif %}

  {% set tool = params.TOOL|int %}
  {% set quiet = params.QUIET|default(0)|int %}
  {% set saved = printer.save_variables.variables %}
  {% set original_types = saved.filament_types|default([]) %}
  {% set original_colors = saved.filament_colors|default([]) %}
  {% set detected_count = saved.filament_tool_count|default(0)|int %}
  {% if detected_count > 0 %}
    {% set tool_count = detected_count %}
  {% elif original_types|length >= original_colors|length and original_types|length > 0 %}
    {% set tool_count = original_types|length %}
  {% elif original_colors|length > 0 %}
    {% set tool_count = original_colors|length %}
  {% else %}
    {% set tool_count = 1 %}
  {% endif %}

  {% if tool < 0 or tool >= tool_count %}
    { action_raise_error('SET_TOOL_FILAMENT TOOL must be between 0 and ' ~ (tool_count - 1)|string) }
  {% endif %}

  {% set ns = namespace(
      filament_types=original_types[:tool_count],
      filament_colors=original_colors[:tool_count],
      nozzle_temps=(saved.filament_nozzle_temps|default([]))[:tool_count],
      bed_temps=(saved.filament_bed_temps|default([]))[:tool_count],
      temp_materials=(saved.filament_temp_materials|default([]))[:tool_count]
  ) %}
  {% for unused in range(ns.filament_types|length, tool_count) %}
    {% set ns.filament_types = ns.filament_types + ['UNSET'] %}
  {% endfor %}
  {% for unused in range(ns.filament_colors|length, tool_count) %}
    {% set ns.filament_colors = ns.filament_colors + ['000000'] %}
  {% endfor %}
  {% for unused in range(ns.nozzle_temps|length, tool_count) %}
    {% set ns.nozzle_temps = ns.nozzle_temps + [0] %}
  {% endfor %}
  {% for unused in range(ns.bed_temps|length, tool_count) %}
    {% set ns.bed_temps = ns.bed_temps + [0] %}
  {% endfor %}
  {% for unused in range(ns.temp_materials|length, tool_count) %}
    {% set ns.temp_materials = ns.temp_materials + ['UNSET'] %}
  {% endfor %}

  {% set empty = params.EMPTY|default(0)|int %}
  {% if empty == 1 %}
    {% set material = 'UNSET' %}
    {% set color = '000000' %}
    {% set nozzle_temp = 0 %}
    {% set bed_temp = 0 %}
  {% else %}
    {% if params.MATERIAL is not defined %}
      { action_raise_error('SET_TOOL_FILAMENT requires MATERIAL unless EMPTY=1') }
    {% endif %}
    {% if params.COLOR is not defined %}
      { action_raise_error('SET_TOOL_FILAMENT requires COLOR unless EMPTY=1') }
    {% endif %}
    {% set material = params.MATERIAL|string|trim|upper %}
    {% set color = params.COLOR|string|trim|upper %}
    {% if color|length == 7 %}
      {% set color = color[1:7] %}
    {% endif %}
    {% if color|length == 8 %}
      {% set color = color[0:6] %}
    {% endif %}
    {% if color|length != 6 %}
      { action_raise_error('SET_TOOL_FILAMENT COLOR must contain six RGB hexadecimal characters') }
    {% endif %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(0)|int %}
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    {% if nozzle_temp < 0 or nozzle_temp > 350 %}
      { action_raise_error('SET_TOOL_FILAMENT NOZZLE_TEMP must be between 0 and 350') }
    {% endif %}
    {% if bed_temp < 0 or bed_temp > 150 %}
      { action_raise_error('SET_TOOL_FILAMENT BED_TEMP must be between 0 and 150') }
    {% endif %}
  {% endif %}

  {% set filament_types = ns.filament_types[:tool] + [material] + ns.filament_types[tool+1:] %}
  {% set filament_colors = ns.filament_colors[:tool] + [color] + ns.filament_colors[tool+1:] %}
  {% set nozzle_temps = ns.nozzle_temps[:tool] + [nozzle_temp] + ns.nozzle_temps[tool+1:] %}
  {% set bed_temps = ns.bed_temps[:tool] + [bed_temp] + ns.bed_temps[tool+1:] %}
  {% set temp_materials = ns.temp_materials[:tool] + [material] + ns.temp_materials[tool+1:] %}

  SAVE_VARIABLE VARIABLE=filament_types VALUE='{filament_types|tojson}'
  SAVE_VARIABLE VARIABLE=filament_colors VALUE='{filament_colors|tojson}'
  SAVE_VARIABLE VARIABLE=filament_nozzle_temps VALUE='{nozzle_temps|tojson}'
  SAVE_VARIABLE VARIABLE=filament_bed_temps VALUE='{bed_temps|tojson}'
  SAVE_VARIABLE VARIABLE=filament_temp_materials VALUE='{temp_materials|tojson}'
  {% if quiet == 0 %}
    RESPOND MSG="Physical T{tool} filament metadata saved: material={material} color={color} nozzle={nozzle_temp} bed={bed_temp}"
  {% endif %}


[gcode_macro FILAMENT_SYNC_STATUS]
description: Display the canonical physical-tool filament metadata
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set original_types = saved.filament_types|default([]) %}
  {% set original_colors = saved.filament_colors|default([]) %}
  {% set detected_count = saved.filament_tool_count|default(0)|int %}
  {% if detected_count > 0 %}
    {% set tool_count = detected_count %}
  {% elif original_types|length >= original_colors|length and original_types|length > 0 %}
    {% set tool_count = original_types|length %}
  {% elif original_colors|length > 0 %}
    {% set tool_count = original_colors|length %}
  {% else %}
    {% set tool_count = 1 %}
  {% endif %}
  {% set ns = namespace(
      filament_types=original_types[:tool_count],
      filament_colors=original_colors[:tool_count],
      nozzle_temps=(saved.filament_nozzle_temps|default([]))[:tool_count],
      bed_temps=(saved.filament_bed_temps|default([]))[:tool_count]
  ) %}
  {% for unused in range(ns.filament_types|length, tool_count) %}
    {% set ns.filament_types = ns.filament_types + ['UNSET'] %}
  {% endfor %}
  {% for unused in range(ns.filament_colors|length, tool_count) %}
    {% set ns.filament_colors = ns.filament_colors + ['000000'] %}
  {% endfor %}
  {% for unused in range(ns.nozzle_temps|length, tool_count) %}
    {% set ns.nozzle_temps = ns.nozzle_temps + [0] %}
  {% endfor %}
  {% for unused in range(ns.bed_temps|length, tool_count) %}
    {% set ns.bed_temps = ns.bed_temps + [0] %}
  {% endfor %}
  RESPOND MSG="Filament sync detected {tool_count} physical tool(s)"
  {% for tool in range(tool_count) %}
    RESPOND MSG="Filament P{tool}: material={ns.filament_types[tool]} color={ns.filament_colors[tool]} nozzle={ns.nozzle_temps[tool]} bed={ns.bed_temps[tool]}"
  {% endfor %}
